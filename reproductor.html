<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">

<title>Reproducer Jr</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
}

header {
  text-align: center;
  padding: 20px;
}

header h1 {
  font-size: 27px;
  letter-spacing: 2px;
}

.movie-title {
  text-align: center;
  margin: 12px;
  color: #ddd;
  font-size: 18px;
}

/* REPRODUCTOR */

.player {
  width: 95%;
  max-width: 1100px;
  margin: 15px auto;
  position: relative;
  background: black;
  overflow: hidden;
  aspect-ratio: 16 / 9;
  border-radius: 10px;
  touch-action: manipulation;
}

video {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
  background: black;
}

/* PANTALLA COMPLETA */

.player:fullscreen {
  width: 100%;
  height: 100%;
  max-width: none;
  margin: 0;
  border-radius: 0;
  aspect-ratio: auto;
  display: flex;
  align-items: center;
  justify-content: center;
}

.player:fullscreen video {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* CAPA DE CONTROLES */

.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease;
}

.overlay.visible {
  opacity: 1;
  pointer-events: auto;
}

/* BOTONES CENTRALES */

.skip-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(35px, 12vw, 100px);
}

.skip-btn {
  width: clamp(55px, 12vw, 75px);
  height: clamp(55px, 12vw, 75px);
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.25);
  background: rgba(20,20,20,.55);
  color: white;
  font-size: clamp(15px, 4vw, 21px);
  font-weight: bold;
  cursor: pointer;
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
}

.skip-btn:active {
  background: rgba(125,65,220,.8);
  transform: scale(.92);
}

/* BOTÓN PANTALLA COMPLETA */

.fullscreen-btn {
  position: absolute;
  right: 15px;
  bottom: 15px;
  border: none;
  border-radius: 50%;
  width: 42px;
  height: 42px;
  background: rgba(20,20,20,.65);
  color: white;
  font-size: 23px;
  cursor: pointer;
}

/* INDICADOR PAUSA */

.pause-indicator {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity .2s;
  font-size: 65px;
  text-shadow: 0 2px 15px black;
}

.pause-indicator.visible {
  opacity: 1;
}

/* PIE */

.back {
  display: block;
  width: fit-content;
  margin: 25px auto;
  padding: 12px 25px;
  background: #7028d9;
  color: white;
  text-decoration: none;
  border-radius: 7px;
}

footer {
  text-align: center;
  color: #777;
  font-size: 12px;
  padding: 20px;
}

/* OCULTAR PÁGINA EN PANTALLA COMPLETA */

body:has(.player:fullscreen) {
  overflow: hidden;
}

.player:fullscreen ~ .back,
.player:fullscreen ~ footer {
  display: none;
}

/* PANTALLA PEQUEÑA */

@media(max-width: 600px) {
  header {
    padding: 14px;
  }

  header h1 {
    font-size: 23px;
  }

  .player {
    width: 100%;
    border-radius: 0;
    margin: 10px 0;
  }
}
</style>
</head>

<body>

<header>
  <h1>Reproducer Jr</h1>
</header>

<div class="movie-title">
  Residen Ev2026
</div>

<div class="player" id="player">

  <video
    id="video"
    playsinline
    preload="metadata"
    disablepictureinpicture
    controlslist="nodownload noremoteplayback">

    <source
      src="https://pub-5d6d024eb924401795da4931cd2e6c2e.r2.dev/%5BDoblaje%20Espa%C3%B1ol%5DResident%20Evil_%20Noche%20cero%20-%201.mp4"
      type="video/mp4">

    Tu navegador no puede reproducir este video.

  </video>

  <!-- INDICADOR DE PAUSA -->

  <div class="pause-indicator" id="pauseIndicator">
    ⏸
  </div>

  <!-- CONTROLES CENTRALES -->

  <div class="overlay" id="overlay">

    <div class="skip-controls">

      <button class="skip-btn" id="backBtn"
        aria-label="Retroceder 5 segundos">
        ↶
        <small>5</small>
      </button>

      <button class="skip-btn" id="forwardBtn"
        aria-label="Adelantar 5 segundos">
        <small>5</small>
        ↷
      </button>

    </div>

    <button
      class="fullscreen-btn"
      id="fullscreenBtn"
      aria-label="Pantalla completa">
      ⛶
    </button>

  </div>

</div>

<a href="index.html" class="back">
  Volver al inicio
</a>

<footer>
  @copyright Jeremyas
</footer>

<script>

const player = document.getElementById("player");
const video = document.getElementById("video");
const overlay = document.getElementById("overlay");

const backBtn = document.getElementById("backBtn");
const forwardBtn = document.getElementById("forwardBtn");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const pauseIndicator = document.getElementById("pauseIndicator");

let hideTimer;
let indicatorTimer;

/* MOSTRAR CONTROLES */

function showControls() {
  overlay.classList.add("visible");

  clearTimeout(hideTimer);

  hideTimer = setTimeout(() => {
    overlay.classList.remove("visible");
  }, 2500);
}

/* OCULTAR CONTROLES */

function hideControls() {
  overlay.classList.remove("visible");
  clearTimeout(hideTimer);
}

/* INDICADOR DE PAUSA */

function showPauseIndicator() {
  pauseIndicator.classList.toggle("visible", video.paused);

  clearTimeout(indicatorTimer);

  if (video.paused) {
    indicatorTimer = setTimeout(() => {
      pauseIndicator.classList.remove("visible");
    }, 1200);
  }
}

/* TOCAR EL VIDEO */

video.addEventListener("click", () => {

  if (video.paused) {
    video.play().catch(() => {});
  } else {
    video.pause();
  }

  showControls();
  showPauseIndicator();

});

/* TOCAR EL FONDO DEL REPRODUCTOR */

player.addEventListener("click", (event) => {

  if (
    event.target === player ||
    event.target === overlay
  ) {
    if (overlay.classList.contains("visible")) {
      hideControls();
    } else {
      showControls();
    }
  }

});

/* RETROCEDER 5 SEGUNDOS */

backBtn.addEventListener("click", (event) => {
  event.stopPropagation();

  video.currentTime = Math.max(
    0,
    video.currentTime - 5
  );

  showControls();
});

/* ADELANTAR 5 SEGUNDOS */

forwardBtn.addEventListener("click", (event) => {
  event.stopPropagation();

  if (Number.isFinite(video.duration)) {
    video.currentTime = Math.min(
      video.duration,
      video.currentTime + 5
    );
  }

  showControls();
});

/* PANTALLA COMPLETA */

async function toggleFullscreen() {

  try {

    if (!document.fullscreenElement) {

      await player.requestFullscreen();

      // Intentar girar el celular horizontalmente.
      if (screen.orientation &&
          screen.orientation.lock) {
        try {
          await screen.orientation.lock("landscape");
        } catch (error) {
          // Algunos navegadores no permiten bloquear orientación.
        }
      }

    } else {

      await document.exitFullscreen();

    }

    showControls();

  } catch (error) {
    console.log("Pantalla completa no disponible", error);
  }

}

fullscreenBtn.addEventListener("click", (event) => {
  event.stopPropagation();
  toggleFullscreen();
});

/* CAMBIO DE PANTALLA COMPLETA */

document.addEventListener("fullscreenchange", () => {

  if (!document.fullscreenElement) {

    if (screen.orientation &&
        screen.orientation.unlock) {
      screen.orientation.unlock();
    }

    hideControls();

  } else {

    showControls();

  }

});

/* CONTROLES CON TECLADO EN PC */

document.addEventListener("keydown", (event) => {

  if (event.target.tagName === "INPUT") return;

  if (event.code === "Space") {
    event.preventDefault();

    if (video.paused) {
      video.play();
    } else {
      video.pause();
    }

    showControls();
  }

  if (event.code === "ArrowLeft") {
    video.currentTime = Math.max(
      0,
      video.currentTime - 5
    );
    showControls();
  }

  if (event.code === "ArrowRight") {
    if (Number.isFinite(video.duration)) {
      video.currentTime = Math.min(
        video.duration,
        video.currentTime + 5
      );
    }
    showControls();
  }

  if (event.code === "Escape") {
    hideControls();
  }

});

/* ACTUALIZAR INDICADOR */

video.addEventListener("play", () => {
  pauseIndicator.classList.remove("visible");
});

video.addEventListener("pause", () => {
  showPauseIndicator();
  showControls();
});

/* AL TERMINAR */

video.addEventListener("ended", () => {
  showControls();
  showPauseIndicator();
});

/* ERROR DE VIDEO */

video.addEventListener("error", () => {
  alert("No se pudo cargar la película. Comprueba la conexión.");
});

</script>

</body>
</html>
