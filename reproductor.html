<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">

<title>Nose</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
}

header {
  text-align: center;
  padding: 20px;
}

header h1 {
  font-size: 27px;
  letter-spacing: 2px;
}

.movie-title {
  text-align: center;
  margin: 12px;
  color: #ddd;
  font-size: 18px;
}

/* REPRODUCTOR */

.player {
  width: 95%;
  max-width: 1100px;
  margin: 15px auto;
  position: relative;
  background: black;
  overflow: hidden;
  aspect-ratio: 16 / 9;
  border-radius: 10px;
  touch-action: manipulation;
}

video {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
  background: black;
}

/* PANTALLA COMPLETA */

.player:fullscreen {
  width: 100%;
  height: 100%;
  max-width: none;
  margin: 0;
  border-radius: 0;
  aspect-ratio: auto;
  display: flex;
  align-items: center;
  justify-content: center;
}

.player:fullscreen video {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* CAPA DE CONTROLES */

.overlay {
  position: absolute;
  inset: 0;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease;
}

.overlay.visible {
  opacity: 1;
  pointer-events: auto;
}

/* CONTROLES CENTRALES */

.center-controls {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(25px, 8vw, 75px);
  pointer-events: none;
}

.control-btn {
  width: clamp(52px, 11vw, 70px);
  height: clamp(52px, 11vw, 70px);
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.18);
  background: rgba(25,25,25,.48);
  color: white;
  font-size: 21px;
  cursor: pointer;
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  pointer-events: auto;
}

.control-btn:active {
  background: rgba(120,65,210,.75);
  transform: scale(.93);
}

.play-btn {
  width: clamp(60px, 13vw, 82px);
  height: clamp(60px, 13vw, 82px);
  font-size: 27px;
}

/* ZONA INFERIOR */

.bottom-controls {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  padding: 35px 14px 12px;
  background: linear-gradient(
    transparent,
    rgba(0,0,0,.75)
  );
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* BARRA DE PROGRESO */

.progress {
  width: 100%;
  height: 5px;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255,255,255,.35);
  border-radius: 10px;
  outline: none;
  cursor: pointer;
  touch-action: pan-y;
}

.progress::-webkit-slider-thumb {
  appearance: none;
  -webkit-appearance: none;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: #a66bff;
  border: 2px solid white;
}

.progress::-moz-range-thumb {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: #a66bff;
  border: 2px solid white;
}

/* TIEMPO Y PANTALLA COMPLETA */

.bottom-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.time {
  font-size: 12px;
  color: white;
  text-shadow: 0 1px 4px black;
}

.fullscreen-btn {
  width: 38px;
  height: 34px;
  border: none;
  background: rgba(25,25,25,.5);
  color: white;
  font-size: 23px;
  border-radius: 6px;
  cursor: pointer;
}

/* PIE */

.back {
  display: block;
  width: fit-content;
  margin: 25px auto;
  padding: 12px 25px;
  background: #7028d9;
  color: white;
  text-decoration: none;
  border-radius: 7px;
}

footer {
  text-align: center;
  color: #777;
  font-size: 12px;
  padding: 20px;
}

@media(max-width: 600px) {
  header {
    padding: 14px;
  }

  header h1 {
    font-size: 23px;
  }

  .player {
    width: 100%;
    border-radius: 0;
    margin: 10px 0;
  }

  .bottom-controls {
    padding: 30px 10px 8px;
  }
}

.player:fullscreen ~ .back,
.player:fullscreen ~ footer,
body:has(.player:fullscreen) header,
body:has(.player:fullscreen) .movie-title {
  display: none;
}
</style>
</head>

<body>

<header>
  <h1>Reproducer Jr</h1>
</header>

<div class="movie-title">
  Residen Ev2026
</div>

<div class="player" id="player">

  <video id="video"
    playsinline
    preload="metadata"
    disablepictureinpicture
    controlslist="nodownload noremoteplayback">

    <source
      src="https://pub-5d6d024eb924401795da4931cd2e6c2e.r2.dev/%5BDoblaje%20Espa%C3%B1ol%5DResident%20Evil_%20Noche%20cero%20-%201.mp4"
      type="video/mp4">

    Tu navegador no puede reproducir este video.
  </video>

  <div class="overlay" id="overlay">

    <!-- BOTONES CENTRALES -->

    <div class="center-controls">

      <button class="control-btn" id="backBtn">
        ↶5
      </button>

      <button class="control-btn play-btn" id="playBtn">
        ▶
      </button>

      <button class="control-btn" id="forwardBtn">
        5↷
      </button>

    </div>

    <!-- BARRA Y CONTADOR INFERIOR -->

    <div class="bottom-controls">

      <input
        type="range"
        id="progress"
        class="progress"
        min="0"
        max="1000"
        step="1"
        value="0">

      <div class="bottom-row">

        <span class="time" id="time">
          0:00 / 0:00
        </span>

        <button
          class="fullscreen-btn"
          id="fullscreenBtn"
          aria-label="Pantalla completa">
          ⛶
        </button>

      </div>

    </div>

  </div>
</div>

<a href="index.html" class="back">
  Volver al inicio
</a>

<footer>
  @copyright Jeremyas
</footer>

<script>

const player = document.getElementById("player");
const video = document.getElementById("video");
const overlay = document.getElementById("overlay");

const playBtn = document.getElementById("playBtn");
const backBtn = document.getElementById("backBtn");
const forwardBtn = document.getElementById("forwardBtn");
const progress = document.getElementById("progress");
const time = document.getElementById("time");
const fullscreenBtn = document.getElementById("fullscreenBtn");

let hideTimer;
let seeking = false;

/* FORMATO DE TIEMPO */

function formatTime(seconds) {
  if (!Number.isFinite(seconds)) return "0:00";

  const hours = Math.floor(seconds / 3600);
  const minutes = Math.floor((seconds % 3600) / 60);
  const secs = Math.floor(seconds % 60);

  if (hours > 0) {
    return hours + ":" +
      String(minutes).padStart(2, "0") + ":" +
      String(secs).padStart(2, "0");
  }

  return minutes + ":" +
    String(secs).padStart(2, "0");
}

/* ACTUALIZAR CONTADOR */

function updateTime() {
  time.textContent =
    formatTime(video.currentTime) +
    " / " +
    formatTime(video.duration);
}

/* MOSTRAR CONTROLES */

function showControls() {
  overlay.classList.add("visible");

  clearTimeout(hideTimer);

  if (!video.paused && !seeking) {
    hideTimer = setTimeout(() => {
      overlay.classList.remove("visible");
    }, 3000);
  }
}

/* OCULTAR CONTROLES */

function hideControls() {
  overlay.classList.remove("visible");
  clearTimeout(hideTimer);
}

/* REPRODUCIR Y PAUSAR */

function togglePlay() {
  if (video.paused) {
    video.play().catch(() => {});
  } else {
    video.pause();
  }
}

playBtn.addEventListener("click", (event) => {
  event.stopPropagation();
  togglePlay();
  showControls();
});

/* ACTUALIZAR BOTÓN */

video.addEventListener("play", () => {
  playBtn.textContent = "Ⅱ";
});

video.addEventListener("pause", () => {
  playBtn.textContent = "▶";
  showControls();
});

/* TOCAR VIDEO */

video.addEventListener("click", () => {
  togglePlay();
  showControls();
});

/* ADELANTAR Y RETROCEDER */

backBtn.addEventListener("click", (event) => {
  event.stopPropagation();

  video.currentTime = Math.max(
    0,
    video.currentTime - 5
  );

  showControls();
});

forwardBtn.addEventListener("click", (event) => {
  event.stopPropagation();

  if (Number.isFinite(video.duration)) {
    video.currentTime = Math.min(
      video.duration,
      video.currentTime + 5
    );
  }

  showControls();
});

/* DURACIÓN Y BARRA */

video.addEventListener("loadedmetadata", () => {
  updateTime();
});

video.addEventListener("durationchange", updateTime);

video.addEventListener("timeupdate", () => {
  if (
    Number.isFinite(video.duration) &&
    !seeking
  ) {
    progress.value =
      (video.currentTime / video.duration) * 1000;
  }

  updateTime();
});

/* DESPLAZARSE POR LA PELÍCULA */

progress.addEventListener("pointerdown", (event) => {
  event.stopPropagation();
  seeking = true;
  clearTimeout(hideTimer);
});

progress.addEventListener("input", () => {
  if (Number.isFinite(video.duration)) {
    video.currentTime =
      (Number(progress.value) / 1000) * video.duration;
  }

  updateTime();
});

progress.addEventListener("change", () => {
  seeking = false;
  showControls();
});

progress.addEventListener("pointerup", () => {
  seeking = false;
  showControls();
});

/* PANTALLA COMPLETA */

async function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      await player.requestFullscreen();

      if (screen.orientation?.lock) {
        try {
          await screen.orientation.lock("landscape");
        } catch (error) {}
      }

    } else {
      await document.exitFullscreen();
    }

    showControls();

  } catch (error) {
    console.log("Pantalla completa no disponible", error);
  }
}

fullscreenBtn.addEventListener("click", (event) => {
  event.stopPropagation();
  toggleFullscreen();
});

document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement) {
    screen.orientation?.unlock?.();
    hideControls();
  } else {
    showControls();
  }
});

/* TOCAR ESPACIOS VACÍOS */

overlay.addEventListener("click", (event) => {
  if (
    event.target === overlay ||
    event.target.classList.contains("center-controls")
  ) {
    if (overlay.classList.contains("visible")) {
      hideControls();
    } else {
      showControls();
    }
  }
});

/* TECLADO PC */

document.addEventListener("keydown", (event) => {
  if (event.target.tagName === "INPUT") return;

  if (event.code === "Space") {
    event.preventDefault();
    togglePlay();
    showControls();
  }

  if (event.code === "ArrowLeft") {
    video.currentTime = Math.max(0, video.currentTime - 5);
    showControls();
  }

  if (event.code === "ArrowRight") {
    if (Number.isFinite(video.duration)) {
      video.currentTime = Math.min(
        video.duration,
        video.currentTime + 5
      );
    }
    showControls();
  }
});

/* AL TERMINAR */

video.addEventListener("ended", showControls);

/* ERROR */

video.addEventListener("error", () => {
  alert("No se pudo cargar la película. Comprueba tu conexión.");
});

</script>

</body>
</html>
