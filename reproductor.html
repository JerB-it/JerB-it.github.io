<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Residen Ev2026</title>

<style>
body {
    margin: 0;
    padding: 20px 12px;
    background: #090909;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    color: white;
}

video {
    width: 100%;
    max-width: 900px;
    max-height: 65vh;
    background: black;
    border-radius: 12px;
}

.controls {
    max-width: 850px;
    margin: 15px auto;
    background: #191919;
    padding: 20px;
    border-radius: 12px;
}

button {
    background: #792cff;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px 17px;
    margin: 5px;
    cursor: pointer;
}

input {
    accent-color: #792cff;
}

#progress {
    width: 100%;
}

.back {
    display: inline-block;
    margin-top: 20px;
    color: #b995ff;
    text-decoration: none;
}
</style>
</head>

<body>

<h1>Residen Ev2026</h1>

<video id="video" playsinline controls>
    <source src="pelicula.mp4" type="video/mp4">
    Tu navegador no soporta este video.
</video>

<div class="controls">

    <button onclick="video.currentTime =
    Math.max(0, video.currentTime - 10)">
        ⏪ 10s
    </button>

    <button onclick="
    video.paused ? video.play() : video.pause()">
        ▶ / ⏸
    </button>

    <button onclick="
    video.currentTime = Math.min(
    video.duration, video.currentTime + 10)">
        10s ⏩
    </button>

    <p>
        <span id="actual">00:00</span>
        /
        <span id="total">00:00</span>
    </p>

    <input type="range" id="progress"
    min="0" max="100" value="0">

    <br><br>

    🔊 Volumen

    <input type="range" id="volume"
    min="0" max="1" step="0.01" value="1">

    <br><br>

    <button onclick="
    video.requestFullscreen &&
    video.requestFullscreen()">
        ⛶ Pantalla completa
    </button>

</div>

<a class="back" href="index.html">
    ← Volver al inicio
</a>

<script>
const video = document.getElementById("video");
const progress = document.getElementById("progress");
const volume = document.getElementById("volume");

function timeFormat(s) {
    if (!Number.isFinite(s)) return "00:00";

    let m = Math.floor(s / 60);
    let sec = Math.floor(s % 60);

    return String(m).padStart(2, "0") + ":" +
           String(sec).padStart(2, "0");
}

video.addEventListener("loadedmetadata", () => {
    document.getElementById("total").textContent =
        timeFormat(video.duration);
});

video.addEventListener("timeupdate", () => {
    document.getElementById("actual").textContent =
        timeFormat(video.currentTime);

    progress.value = video.duration ?
        video.currentTime / video.duration * 100 : 0;
});

progress.addEventListener("input", () => {
    if (video.duration) {
        video.currentTime =
            progress.value / 100 * video.duration;
    }
});

volume.addEventListener("input", () => {
    video.volume = Number(volume.value);
});
</script>

</body>
</html>
