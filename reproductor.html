<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">

  <title>Reproducer Jr</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      text-align: center;
      padding: 22px 10px;
    }

    header h1 {
      font-size: 28px;
      letter-spacing: 2px;
      color: white;
    }

    .movie-title {
      text-align: center;
      margin: 15px 10px;
      font-size: 19px;
      color: #ddd;
    }

    .player-container {
      width: 95%;
      max-width: 1000px;
      margin: 10px auto;
      background: black;
      aspect-ratio: 16 / 9;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(130, 60, 255, 0.2);
    }

    .player-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .buttons {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .back-button {
      background: #7028d9;
      color: white;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 15px;
      transition: 0.2s;
    }

    .back-button:hover {
      background: #873fff;
    }

    footer {
      text-align: center;
      color: #777;
      font-size: 12px;
      padding: 20px;
      margin-top: auto;
    }
  </style>
</head>

<body>

  <header>
    <h1>Reproducer Jr</h1>
  </header>

  <div class="movie-title">
    Residen Ev2026
  </div>

  <main>
    <div class="player-container">

      <iframe
        src="https://drive.google.com/file/d/1oZAxKET74wYgKaGmMvNEV-X58EprC9Xe/preview"
        allow="autoplay; fullscreen"
        allowfullscreen>
      </iframe>

    </div>

    <div class="buttons">
      <a href="index.html" class="back-button">
        Volver al inicio
      </a>
    </div>
  </main>

  <footer>
    @copyright Jeremyas
  </footer>

</body>
</html>
